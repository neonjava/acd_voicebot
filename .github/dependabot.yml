version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: team/sde-1-voicebot
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: uv
    directory: /projects/sde-1-voicebot/backend
    target-branch: team/sde-1-voicebot
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /projects/sde-1-voicebot/frontend
    target-branch: team/sde-1-voicebot
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
