name: Backend CI

on:
  push:
    branches:
      - team/sde-1-voicebot
      - feature/**
    paths:
      - "projects/sde-1-voicebot/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - team/sde-1-voicebot
    paths:
      - "projects/sde-1-voicebot/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/sde-1-voicebot/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ruff pytest pytest-asyncio

      - name: Lint and format check with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run test suite
        run: |
          pytest -v
