name: Backend CI

on:
  push:
    branches:
      - team/sde-1-voicebot
      - feature/**
      - rakshita
    paths:
      - "projects/sde-1-voicebot/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - team/sde-1-voicebot
    paths:
      - "projects/sde-1-voicebot/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/sde-1-voicebot/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify locked dependencies install with uv
        run: uv sync --locked --extra dev

      - name: Verify reproducible wheel package install with pip
        run: uv pip install .

      - name: Lint and format check with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run test suite with pytest
        run: uv run pytest -v
