[project]
name = "sde-1-voicebot-backend"
version = "0.1.0"
description = "SDE 1 Voicebot Backend and Shared Contracts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]
# Real local providers (product target, docs/product.md). Never needed for tests or CI.
audio = [
    "sounddevice>=0.5.0",
    "openwakeword>=0.6.0",
]
stt = [
    "faster-whisper>=1.1.0",
]
system = [
    "psutil>=6.0.0",
]
browser = [
    "playwright>=1.48.0",
]
tts = [
    "piper-tts>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.uv]
# openwakeword lists tflite-runtime on Linux, which has no Python 3.12 wheels.
# We run its ONNX models through onnxruntime instead, so tflite-runtime is never installed.
override-dependencies = ["tflite-runtime; python_version < '3.12'"]
